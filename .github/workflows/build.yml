name: Build, Test, and Push FastAPI

on:
  push:
    branches: [ "master" ]

# Grants permission to write images to GHCR
permissions:
  packages: write
  contents: read

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} -t ghcr.io/${{ github.repository }}:latest .

      - name: Test the container
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          docker run -d -p 8000:8000 -e APP_SECRET="$APP_SECRET" --name test-container ghcr.io/${{ github.repository }}:${{ github.sha }}
          sleep 5
          echo "Testing /health endpoint..."
          curl --fail http://localhost:8000/health
          echo -e "\nTesting / endpoint..."
          curl --fail http://localhost:8000/
          docker stop test-container

      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:latest
